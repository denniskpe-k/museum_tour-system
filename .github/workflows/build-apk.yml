name: Build Android APK

# Builds the app into a downloadable .apk automatically, using GitHub's
# free build servers — no Android SDK/NDK or Linux machine needed on
# your own computer. Triggers on every push to main/master, and can
# also be run manually from the Actions tab ("Run workflow").
#
# After a run finishes, download the APK from the run's page under
# "Artifacts" (bottom of the summary page) — look for "museum-tour-apk".

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer global directory (speeds up later builds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer and Android build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5 libncurses5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake build-essential
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build the debug APK
        run: |
          yes | buildozer android debug

      - name: Locate the built APK
        run: find . -name "*.apk"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: museum-tour-apk
          path: bin/*.apk
          if-no-files-found: error
