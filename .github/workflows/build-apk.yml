name: Build Android APK

# Builds the app into a downloadable .apk automatically, using GitHub's
# free build servers — no Android SDK/NDK or Linux machine needed on
# your own computer. Triggers on every push to main/master, and can
# also be run manually from the Actions tab ("Run workflow").
#
# After a run finishes, download the APK from the run's page under
# "Artifacts" (bottom of the summary page) — look for "museum-tour-apk".

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 for Gradle 
        uses: actions/setup-java@v4 
        with: 
          distribution: "temurin" 
          java-version: "17"

      - name: Cache Android SDK/NDK downloads (safe to reuse across spec changes)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-ndk-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sdk-ndk-${{ runner.os }}-

      # No restore-keys here, deliberately: this directory holds the
      # actual per-arch build state (venvs, compiled recipes, pip
      # installs). Falling back to a cache built under a *different*
      # buildozer.spec (e.g. an older NDK/Python pin from a previous
      # failed attempt) can leave mismatched files behind — this is
      # exactly what caused the "cannot import name 'open_rich_spinner'"
      # pip crash: a stale pip install from an earlier NDK r28c attempt
      # got restored into this directory and corrupted pip's imports
      # once python-for-android pointed PYTHONPATH at it. An exact-only
      # key means a buildozer.spec change always starts this directory
      # genuinely fresh instead of risking that again.
      - name: Cache Buildozer project build state (exact spec match only)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer and Android build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5 libncurses5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake build-essential
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build the debug APK
        run: |
          yes | buildozer android debug

      - name: Locate the built APK
        run: find . -name "*.apk"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: museum-tour-apk
          path: bin/*.apk
          if-no-files-found: error
